# Цвета государственного флага Казахстана: небесно-голубой (Pantone 3125, #00ABC2) и золотой (#FEC50C).
# Для кнопок голубой затемнён до #007E99: белый текст на нём читается (контраст 4,7:1), на #00ABC2 — нет (2,6:1).
# Тема светлая для всех: в тёмной теме таблица «до → после» нечитаема. Streamlit читает файл из папки запуска.
[theme]
base = "light"
primaryColor = "#007E99"
backgroundColor = "#F7FBFC"
secondaryBackgroundColor = "#E3F4F7"
textColor = "#0B2545"
linkColor = "#007E99"
borderColor = "#B9DDE5"
dataframeHeaderBackgroundColor = "#E3F4F7"
chartCategoricalColors = ["#00ABC2", "#FEC50C", "#0B2545", "#7BC47F", "#E8833A"]
baseRadius = "0.6rem"

[client]
# без кнопки Deploy и меню разработчика
toolbarMode = "minimal"
